name: CI — Проверка качества портфолио музыканта

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-check:
    name: Тестирование и проверка статики
    runs-on: ubuntu-latest

    steps:
      - name: 1. Получение исходного кода
        uses: actions/checkout@v4

      - name: 2. Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 3. Установка зависимостей
        run: npm install

      - name: 4. Базовая проверка синтаксиса JS-файлов
        run: |
          for file in *.js; do
            [ -f "$file" ] && node --check "$file"
          done

      - name: 5. Запуск модульных тестов (Jest)
        run: npx jest

      - name: 6. Проверка наличия точки входа (index.html)
        run: test -f index.html && echo "index.html найден, статика готова к деплою"
